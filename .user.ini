; Impostazioni PHP per l'hosting universitario, dove PHP gira in FPM/FastCGI.
; Vale per questa cartella e per tutte quelle sotto.
;
; In sviluppo (immagine php:apache, mod_php) questo file viene ignorato: li'
; le stesse impostazioni arrivano da conf.d/zz-security.ini nel Dockerfile.
;
; Solo le direttive PHP_INI_ALL e PHP_INI_PERDIR hanno effetto qui: expose_php,
; per esempio, e' PHP_INI_SYSTEM e va impostata dal gestore del server.
;
; PHP rilegge questo file al massimo ogni user_ini.cache_ttl secondi
; (300 di default): dopo una modifica puo' volerci qualche minuto.

; Nessun messaggio di errore all'utente: i dettagli vanno nei log.
; Sul server la configurazione di partenza aveva display_errors attivo, il che
; mostrava percorsi e frammenti di codice a chiunque.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL

; I cookie di sessione restano fuori dalla portata di JavaScript.
; (Il token di login usa gia' HttpOnly, impostato in jwt_helper.php.)
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
